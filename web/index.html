<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TallyLive">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TallyLive</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #E8F2FF 0%, #FFFFFF 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease-out;
    }
    .logo-card {
      background: white;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-img {
      width: 90px;
      height: 90px;
      border-radius: 16px;
      object-fit: contain;
    }
    .app-title {
      margin-top: 14px;
      font-size: 26px;
      font-weight: 800;
      color: #1A1F36;
      letter-spacing: 0.5px;
    }
    .app-subtitle {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 500;
      color: #8792A2;
    }
    .loader-bar {
      margin-top: 28px;
      width: 120px;
      height: 4px;
      background: #DFE8F4;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .loader-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: #2453FF;
      border-radius: 4px;
      animation: indeterminate 1.4s infinite ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes indeterminate {
      0% { left: -40%; width: 40%; }
      50% { left: 40%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }
  </style>
</head>
<body>
  <div class="splash-container" id="app-loading">
    <div class="logo-card">
      <img src="icons/Icon-192.png" alt="TallyLive Logo" class="logo-img" />
      <div class="app-title">TallyLive</div>
      <div class="app-subtitle">Live Tally Data Portal</div>
    </div>
    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
